name: CodeSense CI Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Run CodeSense Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train/Verify CodeSense ML Model
        run: |
          python train_model.py --samples 5000

      - name: Run Comprehensive Test Suite
        run: |
          python tests/test_suite_enhanced.py

      - name: Run CodeSense DevSecOps Gate
        run: |
          python cli.py . --min-score 60.0 --fail-on-sec --format markdown --output codesense_audit.md

      - name: Publish GitHub Step Summary
        if: always()
        run: |
          if [ -f codesense_audit.md ]; then
            cat codesense_audit.md >> $GITHUB_STEP_SUMMARY
          fi
